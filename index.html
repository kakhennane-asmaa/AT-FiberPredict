<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>

    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(0, 255, 255, 0.25);
            --glass-blur: blur(12px);
            --neon-cyan: #00f0ff;
            --neon-blue: #3b82f6;
            --neon-purple: #a855f7;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --neon-pink: #ec4899;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 20% 20%, #0f172a, #020617 80%);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }
        .app-header { text-align: center; margin-bottom: 30px; }
        .app-header h1 {
            color: var(--neon-cyan);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .app-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        .language-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .lang-btn {
            background-color: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .lang-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
        .lang-btn.active { background-color: var(--neon-cyan); color: #0a0e17; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .container { max-width: 1100px; margin: 0 auto; }
        .card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 20px;
        }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        .btn {
            background-color: rgba(0, 240, 255, 0.05);
            color: var(--neon-cyan);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 140px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            background-color: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-outline { background-color: transparent; color: var(--neon-purple); border-color: var(--neon-purple); }
        .btn-outline:hover { background-color: rgba(168, 85, 247, 0.15); box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }
        .btn-success { background-color: rgba(16, 185, 129, 0.1); color: var(--neon-green); border-color: var(--neon-green); }
        .btn-success:hover { background-color: rgba(16, 185, 129, 0.2); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        .btn-warning { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; border-color: #fbbf24; }
        .btn-warning:hover { background-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
        .file-label {
            background-color: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid #fbbf24;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;

        }

        input[type="file"] { display: none; }
        .seed-box { text-align: center; margin-bottom: 15px; }

            padding: 8px 12px;

            border: 1px solid var(--glass-border);

            color: var(--text-primary);
            width: 90px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
        }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(5px);

            padding: 15px;
            text-align: center;

        .metric-card .value { font-size: 24px; font-weight: 800; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .metric-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {

        let currentLang = localStorage.getItem('fiberpredict_lang') || 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('fiberpredict_lang', lang);
            document.getElementById('html-root').lang = lang;
            document.getElementById('html-root').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            buildTableHeaders();
            if (window.lastResults) {
                processSubscribers(window.lastResults.subscribers);
            }
        }

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function buildTableHeaders() {
            document.getElementById('top5Head').innerHTML = `
                <tr>

            `;

        // ==================== SEEDED RANDOM ====================
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // ==================== SIMULATION ====================
        function generateSubscribers(rand) {
            const subscribers = [];
            const numFailures = Math.floor(NUMBER_OF_SUBSCRIBERS * 0.20);
            const failureIds = new Set();
            while (failureIds.size < numFailures) {
                failureIds.add(Math.floor(rand() * NUMBER_OF_SUBSCRIBERS) + 1);
            }
            const ponGroupsWithSplitterIssue = new Set();
            const numSplitterIssues = Math.floor(NUMBER_OF_PON_GROUPS * 0.2);
            while (ponGroupsWithSplitterIssue.size < numSplitterIssues) {
                ponGroupsWithSplitterIssue.add(Math.floor(rand() * NUMBER_OF_PON_GROUPS) + 1);
            }
            for (let i = 1; i <= NUMBER_OF_SUBSCRIBERS; i++) {
                const groupId = ((i - 1) % NUMBER_OF_PON_GROUPS) + 1;
                const groupHasIssue = ponGroupsWithSplitterIssue.has(groupId);
                let rx = -17 - rand() * 7;
                let faultType, degradationRate, suddenDrop = false;
                if (failureIds.has(i) || (groupHasIssue && rand() < 0.2)) {
                    const faultRand = rand();
                    if (faultRand < 0.3) { faultType = 'CONTAMINATION'; degradationRate = 0.2 + rand() * 0.3; }
                    else if (faultRand < 0.55) { faultType = 'MACROBEND'; degradationRate = 0.5 + rand() * 0.4; suddenDrop = rand() < 0.5; }
                    else if (faultRand < 0.75) { faultType = 'BREAK'; degradationRate = 0.7 + rand() * 0.5; suddenDrop = true; }
                    else { faultType = 'SPLICE'; degradationRate = 0.3 + rand() * 0.4; }
                } else {
                    if (rand() < 0.15) { faultType = 'CONTAMINATION'; degradationRate = 0.25 + rand() * 0.25; }
                    else { faultType = 'STABLE'; degradationRate = rand() * 0.15; }
                }
                const history = [];
                let current = rx;
                const seasonalPattern = [0.05, -0.03, 0.02, -0.05, 0.04, -0.02, 0.03, -0.04];
                for (let m = 0; m < MONTHS_HISTORY; m++) {
                    const noise = (rand() - 0.5) * 0.5;
                    const seasonal = seasonalPattern[m];
                    history.push(current + noise + seasonal);
                    if (faultType === 'SPLICE') { if (m % 3 === 0 || m % 2 === 0) current -= degradationRate; }
                    else if (faultType === 'BREAK') { if (m === MONTHS_HISTORY - 1) current -= 2.5; else current -= degradationRate; }
                    else if (faultType === 'MACROBEND') { if (suddenDrop && m === 3) current -= 1.5; else current -= degradationRate; }
                    else { current -= degradationRate; }
                }
                let futureFailure = false;
                for (let f = 0; f < MONTHS_FUTURE; f++) {
                    if (faultType === 'SPLICE' && f % 2 === 0) current -= degradationRate;
                    else if (faultType === 'BREAK' && f === 1) current -= 2.5;
                    else current -= degradationRate;
                    const futureNoise = (rand() - 0.5) * 0.3;
                    const futureSeasonal = seasonalPattern[(MONTHS_HISTORY + f) % seasonalPattern.length];
                    const futureRx = current + futureNoise + futureSeasonal;
                    if (futureRx <= CRITICAL_THRESHOLD) { futureFailure = true; break; }
                }
                subscribers.push({ id: i, groupId, history, actualRx: current, actualFailure: futureFailure, degradationRate, faultType });
            }
            return subscribers;
        }

        // ==================== CSV LOADING ====================
        function handleCSVFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => processCSVData(e.target.result);
            reader.readAsText(file);
            event.target.value = '';
        }

        function loadDefaultCSV() {
            fetch('data/subscribers_data.csv')
                .then(res => res.text())
                .then(text => processCSVData(text))
                .catch(err => alert('Error loading CSV: ' + err.message));
        }

        function processCSVData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) { alert('Empty file'); return; }
            const headers = lines[0].split(',').map(h => h.trim());
            const required = ['subscriber_id', 'month_1', 'month_2', 'month_3', 'month_4', 'month_5', 'month_6', 'month_7', 'month_8', 'actual_failure'];
            const missing = required.filter(r => !headers.includes(r));
            if (missing.length > 0) { alert('Missing columns: ' + missing.join(', ')); return; }
            const subscribers = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',').map(v => v.trim());
                if (cols.length < headers.length) continue;
                const id = parseInt(cols[headers.indexOf('subscriber_id')]);
                const history = [];
                for (let m = 1; m <= MONTHS_HISTORY; m++) history.push(parseFloat(cols[headers.indexOf('month_' + m)]));
                const actualFailure = parseInt(cols[headers.indexOf('actual_failure')]) === 1;
                subscribers.push({ id, groupId: 'غير محدد', history, actualRx: history[history.length-1], actualFailure, degradationRate: 0, faultType: 'غير محدد' });
            }
            subscribers.forEach(sub => {
                const first = sub.history[0], last = sub.history[sub.history.length-1];
                sub.degradationRate = (first - last) / (MONTHS_HISTORY - 1);
                sub.faultType = determineRootCause(sub);
            });
            window.dataSource = 'csv';
            processSubscribers(subscribers);
        }

        // ==================== ROOT CAUSE ====================
        function determineRootCause(subscriber) {
            const h = subscriber.history;
            const diffs = [];
            for (let i = 1; i < h.length; i++) diffs.push(h[i-1] - h[i]);
            if (diffs.length < 3) return 'STABLE';
            const avgDrop = subscriber.degradationRate || 0;
            const lastDrop = diffs[diffs.length - 1];
            const maxDrop = Math.max(...diffs);
            const minDrop = Math.min(...diffs);
            const std = Math.sqrt(diffs.reduce((a,b) => a + (b-avgDrop)**2, 0) / diffs.length);
            if (lastDrop > 2.5 || (lastDrop > 1.5 && lastDrop > 2 * avgDrop)) return 'BREAK';
            else if (maxDrop > 1.2 && std > 0.4) return 'MACROBEND';
            else if (std > 0.3 && minDrop < 0.05) return 'SPLICE';
            else if (avgDrop > 0.15 && std <= 0.3) return 'CONTAMINATION';
            else return 'STABLE';
        }

        function translateFaultType(faultType) {
            const mapping = {
                'CONTAMINATION': 'fault_contamination',
                'MACROBEND': 'fault_macrobend',
                'BREAK': 'fault_break',
                'SPLICE': 'fault_splice',
                'STABLE': 'fault_stable',
                'غير محدد': 'undefined'
            };
            return t(mapping[faultType] || 'undefined');
        }

        // ==================== PREDICTION ====================
        function smoothSeries(data, windowSize = 3) {
            const smoothed = [];
            for (let i = 0; i < data.length; i++) {
                const start = Math.max(0, i - windowSize + 1);
                const subset = data.slice(start, i + 1);
                smoothed.push(subset.reduce((a,b) => a+b, 0) / subset.length);
            }
            return smoothed;
        }

        function linearRegression(y) {
            const n = y.length;
            const x = Array.from({length: n}, (_, i) => i + 1);
            const sumX = x.reduce((a,b) => a+b, 0);
            const sumY = y.reduce((a,b) => a+b, 0);
            const sumXY = x.reduce((a,b,i) => a + b*y[i], 0);
            const sumX2 = x.reduce((a,b) => a + b*b, 0);
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept };
        }

        function detectTemporalAnomaly(history) {
            const lastThree = history.slice(-3);
            if (lastThree.length < 3) return false;
            const mean = lastThree.reduce((a,b) => a+b, 0) / 3;
            const variance = lastThree.reduce((a,b) => a + (b-mean)**2, 0) / 3;
            const std = Math.sqrt(variance);
            const last = lastThree[2], prev = lastThree[1];
            return (prev - last) > 2 * std;
        }

        function confidenceScore(slope, anomaly, history) {
            let confidence = 0;
            const avgSlope = Math.abs(slope);
            if (avgSlope > 0.5) confidence += 60;
            else if (avgSlope > 0.3) confidence += 40;
            else if (avgSlope > 0.15) confidence += 20;
            if (anomaly) confidence += 20;
            const lastRx = history[history.length-1];
            const distance = Math.abs(CRITICAL_THRESHOLD - lastRx);
            if (distance < 1) confidence += 20;
            else if (distance < 2) confidence += 10;
            return Math.min(95, confidence);
        }

        function survivalProbability(predictedRx) {
            const diff = predictedRx - CRITICAL_THRESHOLD;
            return 1 / (1 + Math.exp(-diff / 1.5));
        }

        function predictFailure(subscriber) {
            const smoothed = smoothSeries(subscriber.history, 3);
            const { slope, intercept } = linearRegression(smoothed);
            let monthsToCritical = Infinity;
            if (slope < 0) monthsToCritical = (CRITICAL_THRESHOLD - intercept) / slope;
            const lastRx = subscriber.history[subscriber.history.length-1];
            const distanceToCritical = Math.max(0, CRITICAL_THRESHOLD - lastRx);
            const anomaly = detectTemporalAnomaly(subscriber.history);
            let riskScore = Math.min(100, Math.abs(slope) * 60 + distanceToCritical * 5);
            if (anomaly) riskScore = Math.min(100, riskScore + 10);
            const warning = (Math.abs(slope) > 0.45) || (monthsToCritical <= 3 && monthsToCritical >= 0);
            const confidence = confidenceScore(slope, anomaly, subscriber.history);
            const survivalProbabilities = [];
            for (let m = 1; m <= 3; m++) {
                const predictedRx = intercept + slope * (MONTHS_HISTORY + m);
                survivalProbabilities.push(survivalProbability(predictedRx).toFixed(2));
            }
            return { slope, predictedMonths: monthsToCritical, riskScore, warning, anomaly, confidence, survivalProbabilities };
        }

        function classifyRisk(pred) {
            const score = pred.riskScore;
            if (pred.warning) {
                if (score >= 65) return 'حرج';
                else return 'خطر';
            } else {
                if (score >= 20) return 'مراقبة';
                else return 'مستقر';
            }
        }

        function translateCategory(cat) {
            const map = { 'مستقر': 'stable', 'مراقبة': 'monitor', 'خطر': 'danger', 'حرج': 'critical' };
            return t(map[cat] || 'stable');
        }

        function isPositiveRisk(category) { return category === 'خطر' || category === 'حرج'; }

        // ==================== METRICS ====================
        function computeMetrics(subscribers, predictions, categories) {
            let tp=0,fp=0,tn=0,fn=0;
            subscribers.forEach((sub,i) => {
                const actual = sub.actualFailure;
                const pred = isPositiveRisk(categories[i]);
                if (actual && pred) tp++;
                else if (!actual && pred) fp++;
                else if (!actual && !pred) tn++;
                else if (actual && !pred) fn++;
            });
            const precision = tp/(tp+fp)||0;
            const recall = tp/(tp+fn)||0;
            const f1 = 2*(precision*recall)/(precision+recall)||0;
            const accuracy = (tp+tn)/(tp+tn+fp+fn);
            return { tp, fp, tn, fn, precision, recall, f1, accuracy };
        }

        function computeROC(subscribers, predictions) {
            const sorted = subscribers.map((_,i)=>i).sort((a,b)=>predictions[b].riskScore - predictions[a].riskScore);
            let tp=0,fp=0;
            const totalPos = subscribers.filter(s=>s.actualFailure).length;
            const totalNeg = subscribers.length - totalPos;
            const points = [[0,0]];
            for (const idx of sorted) {
                if (subscribers[idx].actualFailure) tp++; else fp++;
                points.push([fp/totalNeg, tp/totalPos]);
            }
            let auc = 0;
            for (let i=1;i<points.length;i++) {
                const [x1,y1] = points[i-1], [x2,y2] = points[i];
                auc += (x2-x1)*(y1+y2)/2;
            }
            return { points, auc };
        }

        // ==================== RENDER ====================
        function processSubscribers(subscribers) {
            if (window.dataSource !== 'csv') {
                subscribers.forEach(sub => { sub.faultType = determineRootCause(sub); });
            }
            const predictions = subscribers.map(sub => predictFailure(sub));
            const categories = predictions.map(p => classifyRisk(p));
            const metrics = computeMetrics(subscribers, predictions, categories);
            const roc = computeROC(subscribers, predictions);
            window.lastResults = { subscribers, predictions, categories, metrics, roc };

            document.getElementById('metricsBox').innerHTML = `
                <div class="metric-card"><div class="value">${subscribers.length}</div><div class="label">${t('subscriber')}</div></div>
                <div class="metric-card"><div class="value">${metrics.tp + metrics.fn}</div><div class="label">${t('actual_state')}</div></div>
                <div class="metric-card"><div class="value">${(metrics.precision*100).toFixed(1)}%</div><div class="label">Precision</div></div>
                <div class="metric-card"><div class="value">${(metrics.recall*100).toFixed(1)}%</div><div class="label">Recall</div></div>
                <div class="metric-card"><div class="value">${(metrics.f1*100).toFixed(1)}%</div><div class="label">F1-Score</div></div>
                <div class="metric-card"><div class="value">${(metrics.accuracy*100).toFixed(1)}%</div><div class="label">Accuracy</div></div>
                <div class="metric-card"><div class="value">${(roc.auc*100).toFixed(1)}%</div><div class="label">AUC</div></div>
            `;

            const source = window.dataSource === 'csv' ? t('source_csv') : t('source_sim');
            document.getElementById('summary').innerHTML = t('summary_text')
                .replace('{total}', subscribers.length)
                .replace('{risk}', metrics.tp + metrics.fp)
                .replace('{actual}', metrics.tp + metrics.fn)
                .replace('{tp}', metrics.tp)
                .replace('{fp}', metrics.fp) + `<br>${source}`;

            const catCounts = { 'مستقر':0, 'مراقبة':0, 'خطر':0, 'حرج':0 };
            categories.forEach(c => catCounts[c]++);
            document.getElementById('categoryStats').innerHTML = `
                <div class="metric-card"><div class="value">${catCounts['مستقر']}</div><div class="label">${t('stable')}</div></div>
                <div class="metric-card"><div class="value">${catCounts['مراقبة']}</div><div class="label">${t('monitor')}</div></div>
                <div class="metric-card"><div class="value">${catCounts['خطر']}</div><div class="label">${t('danger')}</div></div>
                <div class="metric-card"><div class="value">${catCounts['حرج']}</div><div class="label">${t('critical')}</div></div>
            `;

            if (window.dataSource !== 'csv') {
                document.getElementById('ponSection').style.display = 'block';
                let groupStats = '';
                for (let g = 1; g <= NUMBER_OF_PON_GROUPS; g++) {
                    const groupSubs = subscribers.filter(s => s.groupId === g);
                    const groupRisk = groupSubs.filter(s => isPositiveRisk(categories[subscribers.indexOf(s)]));
                    if (groupRisk.length > 0) groupStats += `Group ${g}: ${groupRisk.length} ${t('danger')}<br>`;
                }
                document.getElementById('ponSummary').innerHTML = groupStats || t('no_pon_risk');
            } else {
                document.getElementById('ponSection').style.display = 'none';
            }

            const sorted = subscribers.map((_,i)=>i).sort((a,b)=>predictions[b].riskScore - predictions[a].riskScore);
            const top5 = sorted.slice(0,5);

            const topTbody = document.getElementById('topRiskTbody');
            topTbody.innerHTML = '';
            top5.forEach(i => {
                const sub = subscribers[i], pred = predictions[i], cat = categories[i];
                const predictedText = pred.predictedMonths > 12 ? t('more_than_year') : (pred.predictedMonths !== Infinity ? pred.predictedMonths.toFixed(1)+' '+t('months_unit') : t('more_than_year'));
                const actualStatus = sub.actualFailure ? t('will_fail') : t('is_stable');
                const rowClass = sub.actualFailure ? 'alert' : (cat === 'حرج' ? 'critical' : cat === 'خطر' ? 'warn' : cat === 'مراقبة' ? 'monitor' : 'safe');
                topTbody.innerHTML += `<tr><td>${sub.id}</td><td>${sub.groupId}</td><td>${sub.history[sub.history.length-1].toFixed(2)}</td><td>${sub.degradationRate.toFixed(3)}</td><td>${predictedText}</td><td>${translateFaultType(sub.faultType)}</td><td>${pred.riskScore.toFixed(1)}</td><td>${pred.confidence}%</td><td>${translateCategory(cat)}</td><td class="${rowClass}">${actualStatus}</td></tr>`;
            });

            const allTbody = document.getElementById('allSubscribersTbody');
            allTbody.innerHTML = '';
            sorted.forEach(i => {
                const sub = subscribers[i], pred = predictions[i], cat = categories[i];
                const predictedText = pred.predictedMonths > 12 ? t('more_than_year') : (pred.predictedMonths !== Infinity ? pred.predictedMonths.toFixed(1)+' '+t('months_unit') : t('more_than_year'));
                const actualStatus = sub.actualFailure ? t('will_fail') : t('is_stable');
                const rowClass = sub.actualFailure ? 'alert' : (cat === 'حرج' ? 'critical' : cat === 'خطر' ? 'warn' : cat === 'مراقبة' ? 'monitor' : 'safe');
                let reason = '';
                if (isPositiveRisk(cat)) {
                    reason = `Degradation ${Math.abs(pred.slope).toFixed(3)} dB/month, expected in ${predictedText}`;
                    if (pred.anomaly) reason += ' (Anomaly)';
                    if (sub.faultType !== 'غير محدد' && sub.faultType !== 'STABLE') reason += ` (${translateFaultType(sub.faultType)})`;
                } else if (cat === 'مراقبة') reason = t('monitor');
                else reason = t('stable');
                const survivalText = pred.survivalProbabilities.map((p,idx) => `M${idx+1}: ${p}`).join(' | ');
                allTbody.innerHTML += `<tr><td>${sub.id}</td><td>${sub.groupId}</td><td>${sub.history[sub.history.length-1].toFixed(2)}</td><td>${sub.degradationRate.toFixed(3)}</td><td>${translateFaultType(sub.faultType)}</td><td>${pred.riskScore.toFixed(1)}</td><td>${pred.confidence}%</td><td>${translateCategory(cat)}</td><td class="${rowClass}">${actualStatus}</td><td>${reason}</td><td class="survival-box">${survivalText}</td></tr>`;
            });

            drawSignalChartManual(subscribers, top5);
            drawROCChartManual(roc.points, roc.auc);
            document.getElementById('results').style.display = 'block';
        }

        // ==================== CHARTS (Neon colors) ====================
        function drawSignalChartManual(subscribers, indices) {
            const canvas = document.getElementById('signalChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0,0,W,H);
            const padding = 50, chartW = W-padding*2, chartH = H-padding*2;

            // Grid
            ctx.strokeStyle = 'rgba(0,240,255,0.2)';
            ctx.lineWidth = 0.5;
            for (let x = padding; x <= W-padding; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, padding); ctx.lineTo(x, H-padding); ctx.stroke();
            }
            for (let y = padding; y <= H-padding; y += 20) {
                ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(W-padding, y); ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padding,padding); ctx.lineTo(padding,H-padding); ctx.lineTo(W-padding,H-padding); ctx.stroke();
            ctx.fillStyle = '#e2e8f0'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText(t('months_unit'), W/2, H-10);
            ctx.save(); ctx.translate(20,H/2); ctx.rotate(-Math.PI/2); ctx.fillText('Rx Power',0,0); ctx.restore();

            const allValues = indices.flatMap(i => subscribers[i].history);
            const maxVal = Math.max(...allValues)+1, minVal = Math.min(...allValues)-1;
            const neonColors = ['#00f0ff', '#a855f7', '#10b981', '#fbbf24', '#ec4899'];
            indices.forEach((idx,k) => {
                const sub = subscribers[idx], color = neonColors[k % neonColors.length];
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                for (let m=0; m<sub.history.length; m++) {
                    const x = padding + (m/(MONTHS_HISTORY-1))*chartW;
                    const y = padding + ((maxVal-sub.history[m])/(maxVal-minVal))*chartH;
                    if (m===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Critical threshold line
            const yCrit = padding + ((maxVal-CRITICAL_THRESHOLD)/(maxVal-minVal))*chartH;
            ctx.strokeStyle = '#ef4444';
            ctx.setLineDash([6,4]);
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.moveTo(padding,yCrit); ctx.lineTo(W-padding,yCrit); ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ef4444'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'left';
            ctx.fillText('Critical -28 dBm', W-padding-120, yCrit-5);
        }

        function drawROCChartManual(points, auc) {
            const canvas = document.getElementById('rocChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0,0,W,H);
            const padding = 50, chartW = W-padding*2, chartH = H-padding*2;

            ctx.strokeStyle = 'rgba(0,240,255,0.2)';
            ctx.lineWidth = 0.5;
            for (let x = padding; x <= W-padding; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, padding); ctx.lineTo(x, H-padding); ctx.stroke();
            }
            for (let y = padding; y <= H-padding; y += 20) {
                ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(W-padding, y); ctx.stroke();
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padding,padding); ctx.lineTo(padding,H-padding); ctx.lineTo(W-padding,H-padding); ctx.stroke();
            ctx.fillStyle = '#e2e8f0'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText('False Positive Rate', W/2, H-10);
            ctx.save(); ctx.translate(20,H/2); ctx.rotate(-Math.PI/2); ctx.fillText('True Positive Rate',0,0); ctx.restore();

            ctx.strokeStyle = '#a855f7';
            ctx.setLineDash([4,4]);
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padding,H-padding); ctx.lineTo(W-padding,padding); ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            points.forEach((p,i) => {
                const x = padding + p[0]*chartW;
                const y = padding + (1-p[1])*chartH;
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 16px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText('AUC = '+auc.toFixed(3), W/2, 30);
        }

        // ==================== RUN ====================
        function runPrediction() {
            const seedValue = parseInt(document.getElementById('seedInput').value, 10) || 42;
            const rand = mulberry32(seedValue);
            const subscribers = generateSubscribers(rand);
            window.dataSource = 'simulation';
            processSubscribers(subscribers);
        }

        function compareTwoSeeds() {
            const seed1 = parseInt(document.getElementById('seedInput').value,10)||42;
            const seed2 = seed1+100;
            const results = [seed1, seed2].map(seed => {
                const rand = mulberry32(seed);
                const subscribers = generateSubscribers(rand);
                const predictions = subscribers.map(sub => predictFailure(sub));
                const categories = predictions.map(p => classifyRisk(p));
                const metrics = computeMetrics(subscribers, predictions, categories);
                const roc = computeROC(subscribers, predictions);
                return { seed, metrics, roc };
            });
            let msg = '';
            results.forEach(r => {
                msg += `Seed ${r.seed}: Precision ${(r.metrics.precision*100).toFixed(1)}%, Recall ${(r.metrics.recall*100).toFixed(1)}%, F1 ${(r.metrics.f1*100).toFixed(1)}%, AUC ${(r.roc.auc*100).toFixed(1)}%\n`;
            });
            alert(msg);
        }

        function exportCSV() {
            if (!window.lastResults) { alert('Please run analysis first'); return; }
            const { subscribers, predictions, categories } = window.lastResults;
            let csv = 'subscriber,group,last_rx,degradation,cause,risk_score,confidence,category,actual_state,survival\n';
            subscribers.forEach((sub,i) => {
                const pred = predictions[i], cat = categories[i];
                const actual = sub.actualFailure ? 'failure' : 'ok';
                const survival = pred.survivalProbabilities.join('|');
                csv += `${sub.id},${sub.groupId},${sub.history[sub.history.length-1].toFixed(2)},${sub.degradationRate.toFixed(3)},${sub.faultType},${pred.riskScore.toFixed(1)},${pred.confidence}%,${cat},${actual},${survival}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'AT-FiberPredict_Results.csv';
            link.click();
        }

        function printReport() {
            if (!window.lastResults) { alert('Please run analysis first'); return; }
            document.getElementById('printDate').innerText = new Date().toLocaleString();
            window.print();
        }

        // ==================== INIT ====================
        function init() {
            setLanguage(currentLang);
            buildTableHeaders();
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
                });
            }
        }
        init();
    </script>
</body>
</html>
